name: Desktop package verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/src-tauri/**"
      - "frontend/src/**"
      - "frontend/package*.json"
      - ".github/workflows/desktop-packages.yml"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
            packages: bubblewrap clamav libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf poppler-utils
          - os: macos-latest
            bundle: dmg
            packages: ""
          - os: windows-latest
            bundle: msi
            packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: matrix.packages != ''
        run: sudo apt-get update && sudo apt-get install --yes ${{ matrix.packages }}
      - run: npm ci
        working-directory: frontend
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
        working-directory: frontend
