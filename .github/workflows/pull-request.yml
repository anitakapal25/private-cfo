name: Pull request verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artha_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: artha_conversation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artha_test -d artha_conversation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql://artha_test@localhost:5432/artha_conversation_test
      ARTHA_TEST_DATABASE_URL: postgresql://artha_test@localhost:5432/artha_conversation_test
      JWT_SECRET: ci-only-jwt-key-with-at-least-32-characters
      ENABLE_EXTERNAL_WEBHOOKS: "false"
      ENABLE_FINANCIAL_INTEGRATIONS: "false"
      ENABLE_BACKGROUND_SYNC: "false"
      ENABLE_EXTERNAL_MODEL: "false"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --requirement backend/requirements.txt
      - name: Rehearse migrations on disposable PostgreSQL
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade f4b7c2d9a101
          python -m alembic upgrade head
      - name: Offline backend contracts and safety (synthetic data and mocked models)
        run: python -m pytest -q -ra
        working-directory: backend
      - name: Parse all Python sources
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(), filename=str(p)) for p in pathlib.Path('backend').rglob('*.py')]"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Tauri Linux build libraries
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap clamav libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf poppler-utils
      - run: cargo fmt --check
        working-directory: frontend/src-tauri
      - run: cargo test
        working-directory: frontend/src-tauri
      - run: npm ci
        working-directory: frontend
      - run: npm run tauri build -- --bundles deb
        working-directory: frontend

  repository-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_repository_guardrails.py
      - run: python scripts/check_documentation.py
      - run: python scripts/check_dependency_health.py
