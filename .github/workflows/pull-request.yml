name: Pull request verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-only-jwt-key-with-at-least-32-characters
      ENABLE_EXTERNAL_WEBHOOKS: "false"
      ENABLE_FINANCIAL_INTEGRATIONS: "false"
      ENABLE_BACKGROUND_SYNC: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --requirement backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
      - name: Parse all Python sources
        run: python -c "import ast,pathlib; [ast.parse(p.read_text(), filename=str(p)) for p in pathlib.Path('backend').rglob('*.py')]"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run type-check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  repository-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/check_repository_guardrails.py
      - run: python scripts/check_documentation.py
