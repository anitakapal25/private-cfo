# Small paid deployment for the hosted Artha agent.
services:
  - type: web
    name: private-cfo-free-demo
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    healthCheckPath: /health/ready
    dockerCommand: python start_demo.py
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: private-cfo-free-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_ENCRYPTION_SEED
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: ENABLE_CONVERSATIONAL_AGENT
        value: "true"
      - key: ENABLE_EXTERNAL_MODEL
        value: "false"
      - key: ENABLE_MFA
        value: "true"
      - key: ENABLE_PUBLIC_REGISTRATION
        value: "true"
      - key: EMAIL_DELIVERY_MODE
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: PUBLIC_APP_URL
        value: https://private-cfo-free-demo.onrender.com
      - key: ENABLE_FINANCIAL_INTEGRATIONS
        value: "false"
      - key: ENABLE_BACKGROUND_SYNC
        value: "false"
      - key: ENABLE_PROACTIVE_REVIEWS
        value: "false"
databases:
  - name: private-cfo-free-demo-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: private_cfo_demo
    user: private_cfo_demo
    ipAllowList: []
