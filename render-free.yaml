# Synthetic-data demo only. No payment method or paid model is required.
services:
  - type: web
    name: private-cfo-free-demo
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health/ready
    dockerCommand: python start_demo.py
    envVars:
      - key: ENVIRONMENT
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: private-cfo-free-demo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_ENCRYPTION_SEED
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
      - key: ENABLE_CONVERSATIONAL_AGENT
        value: "true"
      - key: ENABLE_EXTERNAL_MODEL
        value: "false"
      - key: ENABLE_MFA
        value: "true"
      - key: ENABLE_PUBLIC_REGISTRATION
        value: "false"
      - key: EMAIL_DELIVERY_MODE
        value: disabled
      - key: ENABLE_FINANCIAL_INTEGRATIONS
        value: "false"
      - key: ENABLE_BACKGROUND_SYNC
        value: "false"
      - key: ENABLE_PROACTIVE_REVIEWS
        value: "false"
databases:
  - name: private-cfo-free-demo-db
    region: singapore
    plan: free
    databaseName: private_cfo_demo
    user: private_cfo_demo
    ipAllowList: []
