[package]
name = "private-cfo-desktop"
version = "0.1.0"
description = "Local-only document processing host for Private CFO"
edition = "2021"

[lib]
name = "private_cfo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
regex = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }

